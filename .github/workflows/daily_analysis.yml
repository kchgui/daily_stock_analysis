name: 每日股票分析

on:
  workflow_dispatch:          # 允许手动触发
  schedule:
    - cron: '30 21 * * 1-5'   # UTC 21:30 = 北京时间次日 05:30（美股收盘后）

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行股票分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          STOCK_LIST: ${{ secrets.STOCK_LIST }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 可选：需要时再加
          # REPORT_TYPE: full
          # REPORT_SUMMARY_ONLY: false
        run: python main.py

      # 真正把报告传出来（之前只写了提示却没有上传）
      - name: 上传分析报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-report-${{ github.run_number }}
          path: |
            reports/
            logs/
            *.md
            *.html
          if-no-files-found: ignore
          retention-days: 7

      - name: 显示运行结果
        if: always()
        run: |
          echo "分析完成！"
          echo "报告已上传到 Artifacts，可在本页面右侧下载。"
