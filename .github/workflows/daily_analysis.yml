name: 每日股票分析

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制运行（忽略交易日检查）'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # UTC 21:30 = 北京时间次日 05:30（可按需改）
    - cron: '30 21 * * 1-5'

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行股票分析
        env:
          # ========== AI（至少一个有效）==========
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}

          # ========== 自选股（务必先减到 5～8 只）==========
          STOCK_LIST: ${{ secrets.STOCK_LIST }}

          # ========== 新闻搜索（Tavily 超限时靠备用）==========
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          NEWS_MAX_AGE_DAYS: ${{ vars.NEWS_MAX_AGE_DAYS || '14' }}

          # ========== 行情/基本面 ==========
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

          # ========== 降压，减少限流 ==========
          MAX_WORKERS: ${{ vars.MAX_WORKERS || '1' }}
          ANALYSIS_DELAY: ${{ vars.ANALYSIS_DELAY || '15' }}

          # ========== 推送 ==========
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}

          # ========== 报告 ==========
          REPORT_TYPE: ${{ vars.REPORT_TYPE || 'full' }}

          # 手动强制运行（若主程序支持该环境变量）
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: |
          python main.py

      - name: 显示运行结果
        if: always()
        run: |
          echo "分析完成"
          ls -la logs/ 2>/dev/null || true
        run: |
          echo "分析完成！请在 Artifacts 中下载报告"
